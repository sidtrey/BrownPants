name: CI

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BrownPants.sln --locked-mode

      - name: Build
        run: dotnet build BrownPants.sln --configuration Release --no-restore

      - name: Run xUnit tests
        shell: pwsh
        run: ./scripts/test.ps1 -NoBuild

      - name: Check acceptance-criteria hash workflow
        shell: pwsh
        run: ./tests/AcceptanceCriteriaHashTests.ps1

      - name: Check generated test output cleanup
        shell: pwsh
        run: ./tests/TestRunArtifactsTests.ps1

      - name: Check acceptance integrity workflow contract
        shell: pwsh
        run: ./tests/AcceptanceCriteriaIntegrityWorkflowTests.ps1

      - name: Check acceptance criteria amendment policy
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          $labels = @($env:PR_LABELS | ConvertFrom-Json)
          $reviewed = $labels -contains 'acceptance-criteria-reviewed'
          ./scripts/check-acceptance-criteria-review.ps1 -BaseRef $env:PR_BASE -HeadRef $env:PR_HEAD -Reviewed:$reviewed

      - name: Check changed acceptance evidence ledgers
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $changed = ./scripts/get-changed-spec-artifacts.ps1 -EventName $env:EVENT_NAME -RefType $env:REF_TYPE `
            -Before $env:PUSH_BEFORE -Head $env:PUSH_HEAD -PullRequestBase $env:PR_BASE -PullRequestHead $env:PR_HEAD
          $featureDirs = @($changed | Where-Object { $_ -match '^specs/[^/]+/(tasks\.md|acceptance-evidence\.json)$' } | ForEach-Object { $_ -replace '/(tasks\.md|acceptance-evidence\.json)$', '' } | Sort-Object -Unique)
          foreach ($featureDir in $featureDirs) {
            $spec = Join-Path $featureDir 'spec.md'
            if (-not (Test-Path -LiteralPath $spec -PathType Leaf)) { throw "Changed feature artifacts require a spec: $featureDir" }
            $specText = Get-Content -LiteralPath $spec -Raw
            $closedStatus = 'Won' + [char]39 + 't do'
            $statusPattern = '(?im)^\*\*Status\*\*:\s*(?<status>.+?)\s*' + [char]36
            $statusMatch = [regex]::Match($specText, $statusPattern)
            if ($statusMatch.Success -and $statusMatch.Groups['status'].Value -eq $closedStatus) {
              Write-Host "Skipping acceptance evidence for closed feature: $featureDir"
              continue
            }
            $tasks = Join-Path $featureDir 'tasks.md'
            $ledger = Join-Path $featureDir 'acceptance-evidence.json'
            if (-not (Test-Path -LiteralPath $ledger -PathType Leaf)) { throw "Changed feature tasks require an acceptance evidence ledger: $featureDir" }
            ./scripts/check-acceptance-evidence.ps1 -RepositoryRoot . -SpecPath $spec -TasksPath $tasks -EvidencePath $ledger
          }

      - name: Verify recorded acceptance baselines
        shell: pwsh
        run: |
          $baselines = Get-ChildItem -Path specs -Filter acceptance-criteria.sha256 -File -Recurse
          foreach ($baseline in $baselines) {
            $spec = Join-Path $baseline.DirectoryName 'spec.md'
            if (-not (Test-Path -LiteralPath $spec)) { throw "Acceptance baseline has no spec: $($baseline.FullName)" }
            & ./scripts/acceptance-criteria-hash.ps1 -SpecPath $spec -BaselinePath $baseline.FullName
          }

      - name: Set up Python for Spec Kit integration
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install supported Spec Kit CLI
        run: python -m pip install specify-cli==1.2.0

      - name: Check Spec Kit extension
        shell: pwsh
        env:
          BROWNPANTS_REQUIRE_SPECKIT: 'true'
        run: ./tests/SpeckitExtensionTests.ps1

      - name: Check OpenSpec installer
        shell: pwsh
        run: ./tests/OpenSpecInstallerTests.ps1

      - name: Check Copilot prompt integration
        shell: pwsh
        run: ./tests/CopilotPromptIntegrationTests.ps1

      - name: Check Cursor command integration
        shell: pwsh
        run: ./tests/CursorCommandIntegrationTests.ps1

      - name: Check Codex usage report parser
        shell: pwsh
        run: ./tests/CodexUsageParserTests.ps1

      - name: Check local agent skills integration
        shell: pwsh
        run: ./tests/AgentSkillIntegrationTests.ps1

      - name: Pack .NET tool
        run: dotnet pack src/BrownPants.Cli --configuration Release --no-build --output ./artifacts

      - name: Smoke-test packed .NET tool
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'brownpants-tools'
          New-Item -ItemType Directory -Path $toolPath -Force | Out-Null
          $artifactPath = [System.Security.SecurityElement]::Escape((Resolve-Path ./artifacts).Path)
          $smokeConfig = Join-Path $env:RUNNER_TEMP 'brownpants-smoke-nuget.config'
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
              <add key="local-artifacts" value="$artifactPath" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
              <packageSource key="local-artifacts"><package pattern="BrownPants.Cli" /></packageSource>
            </packageSourceMapping>
            <signatureValidationMode>require</signatureValidationMode>
            <trustedSigners>
              <repository name="nuget.org" serviceIndex="https://api.nuget.org/v3/index.json">
                <certificate fingerprint="1F4B311D9ACC115C8DC8018B5A49E00FCE6DA8E2855F9F014CA6F34570BC482D" hashAlgorithm="SHA256" allowUntrustedRoot="false" />
                <certificate fingerprint="5A2901D6ADA3D18260B9C6DFE2133C95D74B9EEF6AE0E5DC334C8454D1477DF4" hashAlgorithm="SHA256" allowUntrustedRoot="false" />
                <certificate fingerprint="0E5F38F57DC1BCC806D8494F4F90FBCEDD988B46760709CBEEC6F4219AA6157D" hashAlgorithm="SHA256" allowUntrustedRoot="false" />
              </repository>
            </trustedSigners>
          </configuration>
          "@ | Set-Content -LiteralPath $smokeConfig -Encoding utf8
          dotnet tool install --tool-path $toolPath --configfile $smokeConfig BrownPants.Cli --version 0.4.0
          if ($LASTEXITCODE -ne 0) { throw "Packed tool installation failed with exit code $LASTEXITCODE." }
          $toolName = if ($IsWindows) { 'brownpants.exe' } else { 'brownpants' }
          $tool = Join-Path $toolPath $toolName
          & $tool --help
          if ($LASTEXITCODE -ne 0) { throw "Packed tool help failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File ./tests/PackedModelRoutingSmoke.ps1 -ToolPath $tool
          if ($LASTEXITCODE -ne 0) { throw "Packed tool model CLI smoke failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File ./tests/PackedGitHubPullRequestSmoke.ps1 -ToolPath $tool
          if ($LASTEXITCODE -ne 0) { throw "Packed tool GitHub pull request smoke failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File ./tests/PackedMultiProviderPullRequestSmoke.ps1 -ToolPath $tool
          if ($LASTEXITCODE -ne 0) { throw "Packed tool multi-provider pull request smoke failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File ./tests/PackedWinFormsSmoke.ps1 -ToolPath $tool
          if ($LASTEXITCODE -ne 0) { throw "Packed tool WinForms analysis smoke failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File ./tests/PackedNativeFlowSmoke.ps1 -ToolPath $tool
          if ($LASTEXITCODE -ne 0) { throw "Packed tool native flow smoke failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File ./tests/PackedNativeImpactSmoke.ps1 -ToolPath $tool
          if ($LASTEXITCODE -ne 0) { throw "Packed tool native impact smoke failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File ./tests/PackedManagedInteropSmoke.ps1 -ToolPath $tool
          if ($LASTEXITCODE -ne 0) { throw "Packed tool managed interop smoke failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File ./tests/PackedImpactGraphCoverageSmoke.ps1 -ToolPath $tool
          if ($LASTEXITCODE -ne 0) { throw "Packed tool impact graph coverage smoke failed with exit code $LASTEXITCODE." }
          & pwsh -NoProfile -File ./tests/PackedJavaScriptTypeScriptSmoke.ps1 -ToolPath $tool
          if ($LASTEXITCODE -ne 0) { throw "Packed tool JavaScript/TypeScript smoke failed with exit code $LASTEXITCODE." }
          New-Item -ItemType Directory -Path ./TestResults -Force | Out-Null
          @'
          ```brownpants-flow
          flowchart ci
          node start start "Start"
          node finish end "Done"
          edge start -> finish
          ```
          '@ | Set-Content -LiteralPath ./TestResults/packed-smoke-flow.md -Encoding utf8
          & $tool diagram . TestResults/packed-smoke-flow.md --output TestResults/packed-smoke.png
          if ($LASTEXITCODE -ne 0) { throw "Packed tool PNG rendering failed with exit code $LASTEXITCODE." }
          $pngBytes = [System.IO.File]::ReadAllBytes((Join-Path (Get-Location) 'TestResults/packed-smoke.png'))
          if ($pngBytes.Length -lt 8 -or (($pngBytes[0..7] -join ',') -ne '137,80,78,71,13,10,26,10')) { throw 'Packed tool did not produce a PNG signature.' }
          & $tool diagram . TestResults/packed-smoke-flow.md --output TestResults/packed-smoke.drawio --format drawio --overwrite
          if ($LASTEXITCODE -ne 0) { throw "Packed tool draw.io rendering failed with exit code $LASTEXITCODE." }
          $diagramXml = [xml][System.IO.File]::ReadAllText((Join-Path (Get-Location) 'TestResults/packed-smoke.drawio'))
          if ($diagramXml.SelectNodes('//mxCell[@vertex="1"]').Count -ne 2 -or $diagramXml.SelectNodes('//mxCell[@edge="1"]').Count -ne 1) { throw 'Packed tool draw.io output does not contain the expected nodes and edge.' }
          if ($diagramXml.SelectNodes('//script | //*[@href] | //*[@src]').Count -ne 0) { throw 'Packed tool draw.io output contains external or executable content.' }
          $report = & $tool inspect . --format json --limit 10 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Packed tool inspection failed with exit code $LASTEXITCODE." }
          if ($report.SchemaVersion -ne 1) { throw "Expected schema version 1, got '$($report.SchemaVersion)' instead." }
          if ($report.FileCount -lt 1) { throw 'Packed tool returned an empty repository inventory.' }
          $placement = & $tool placement --rule 'A durable repository principle' --scope repository --durability enduring --purpose principle --format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Packed tool placement failed with exit code $LASTEXITCODE." }
          if ($placement.Recommendation -ne 'constitution') { throw "Expected constitution recommendation, got '$($placement.Recommendation)'." }
          $clarification = & $tool placement --rule 'An unspecified rule' --format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Packed tool clarification failed with exit code $LASTEXITCODE." }
          if ($clarification.Recommendation -ne 'clarify' -or $clarification.Questions.Count -lt 1) { throw 'Packed tool did not ask for missing placement inputs.' }
