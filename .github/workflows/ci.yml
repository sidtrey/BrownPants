name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BrownPants.sln

      - name: Build
        run: dotnet build BrownPants.sln --configuration Release --no-restore

      - name: Run xUnit tests
        run: dotnet test BrownPants.sln --configuration Release --no-build

      - name: Check acceptance-criteria hash workflow
        shell: pwsh
        run: ./tests/AcceptanceCriteriaHashTests.ps1

      - name: Verify active feature acceptance baseline
        shell: pwsh
        run: ./scripts/acceptance-criteria-hash.ps1 -SpecPath specs/019-instruction-context-framing/spec.md

      - name: Set up Python for Spec Kit integration
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install supported Spec Kit CLI
        run: python -m pip install specify-cli==1.2.0

      - name: Check Spec Kit extension
        shell: pwsh
        env:
          BROWNPANTS_REQUIRE_SPECKIT: 'true'
        run: ./tests/SpeckitExtensionTests.ps1

      - name: Check OpenSpec installer
        shell: pwsh
        run: ./tests/OpenSpecInstallerTests.ps1

      - name: Pack .NET tool
        run: dotnet pack src/BrownPants.Cli --configuration Release --no-build --output ./artifacts

      - name: Smoke-test packed .NET tool
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'brownpants-tools'
          New-Item -ItemType Directory -Path $toolPath -Force | Out-Null
          dotnet tool install --tool-path $toolPath --add-source ./artifacts BrownPants.Cli --version 0.1.0
          $toolName = if ($IsWindows) { 'brownpants.exe' } else { 'brownpants' }
          $tool = Join-Path $toolPath $toolName
          & $tool --help
          if ($LASTEXITCODE -ne 0) { throw "Packed tool help failed with exit code $LASTEXITCODE." }
          $report = & $tool inspect . --format json --limit 10 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Packed tool inspection failed with exit code $LASTEXITCODE." }
          if ($report.SchemaVersion -ne 1) { throw "Expected schema version 1, got '$($report.SchemaVersion)' instead." }
          if ($report.FileCount -lt 1) { throw 'Packed tool returned an empty repository inventory.' }
